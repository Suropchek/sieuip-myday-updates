<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>СИЭУиП · Мой день</title><style>body{font:16px system-ui;background:#f1f4f9;color:#18263d;padding:28px;max-width:480px;margin:12vh auto}h1{font-size:25px}button{background:#1559da;color:white;border:0;padding:14px 20px;border-radius:12px;font:inherit}</style>
<h1>СИЭУиП · Мой день</h1><p id="status">Подключаемся к приложению…</p><button hidden onclick="location.reload()" id="retry">Повторить</button>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(async () => {
  // Preserve SDK launch data across origins. Credentials stay in the fragment.
  const params = new URLSearchParams(location.hash.slice(1));
  const init = window.Telegram?.WebApp?.initData;
  if (init) params.set("tgWebAppData", init);
  for (const [key, value] of Object.entries(window.Telegram?.WebView?.initParams || {})) {
    if (key.startsWith("tgWebApp") && typeof value === "string" && !params.has(key)) params.set(key, value);
  }
  window.Telegram?.WebApp?.ready();
  for (let attempt = 0; attempt < 3; attempt++) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 12000);
    try {
      const response = await fetch("https://raw.githubusercontent.com/Suropchek/sieuip-myday-updates/main/service.json?check=" + Date.now(), {cache:"no-store", redirect:"error", signal:controller.signal});
      if (!response.ok) throw Error();
      const data = await response.json();
      const url = new URL(data.origin);
      if (data.version !== 1 || url.protocol !== "https:" || url.username || url.password || url.port || url.pathname !== "/" || url.search || url.hash || !/^[a-z0-9-]+(?:\.app)?\.lhr\.life$/.test(url.hostname)) throw Error();
      const health = await fetch(url.origin + "/health", {cache:"no-store", signal:controller.signal});
      if (!health.ok || !(await health.json()).ok) throw Error();
      const fragment = params.toString();
      location.replace(url.origin + "/telegram" + location.search + (fragment ? "#" + fragment : ""));
      return;
    } catch {
      document.getElementById("status").textContent = attempt < 2 ? "Переподключаемся к серверу…" : "Сервис временно недоступен. Попробуйте ещё раз.";
    } finally { clearTimeout(timer); }
  }
  document.getElementById("retry").hidden = false;
})();
</script></html>
